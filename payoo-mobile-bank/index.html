<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo Mobile Bank</title>
    <link rel="icon" href="./assets/payoo.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-800">
    <section class="max-w-md mx-auto min-h-screen bg-gray-200 py-6">
        <header>
            <nav class="flex justify-center items-center mt-20">
                <div class="flex justify-center items-center mb-10 mt-10 w-9/12">
                    <img class="w-48 absolute" src="./assets/bg.png" alt="Background">
                    <img class="w-16" src="./assets/Group.png" alt="Logo">
                </div>
            </nav>
        </header>

        <div class="">
            <div class="hero-content flex-col lg:flex-row-reverse">
              <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
                <form class="card-body">
                  <fieldset class="fieldset">
                    <label class="fieldset-label font-bold">Account Number</label>
                    <input value="12345678910" id="account-number" type="number" class="input" placeholder="Enter Account Number" required/>
                    <label class="fieldset-label font-bold">Pin Number</label>
                    <input value="1234" id="pin" type="text" class="input" placeholder="Enter your pin" required/>
                    <button id="login-btn" class="btn bg-blue-500 text-white mt-4">Login</button>
                  </fieldset>
                </form>
              </div>
            </div>
          </div>
    </section>
    <script src="./scripts/login.js"></script>
</body>
</html>
